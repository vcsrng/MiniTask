# MiniTask — XcodeGen spec
#
# Run `xcodegen generate` from the project root to regenerate MiniTask.xcodeproj.
# The .xcodeproj directory can then be safely git-ignored; only this file and
# the source folders need to be committed.
#
# Install: brew install xcodegen
# Usage:   xcodegen generate

name: MiniTask
options:
  bundleIdPrefix: VincentDev
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16"

settings:
  SWIFT_VERSION: "5.9"
  DEVELOPMENT_TEAM: M45X2698V4
  TARGETED_DEVICE_FAMILY: "1,2"
  SWIFT_APPROACHABLE_CONCURRENCY: YES
  SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

targets:
  MiniTask:
    type: application
    platform: iOS
    sources:
      - path: MiniTask
        excludes:
          - "**/*.md"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: VincentDev.MiniTask
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      ENABLE_PREVIEWS: YES

  MiniTaskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MiniTaskTests
    dependencies:
      - target: MiniTask
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: VincentDev.MiniTaskTests
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MiniTask.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MiniTask"
      BUNDLE_LOADER: "$(TEST_HOST)"

  MiniTaskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MiniTaskUITests
    dependencies:
      - target: MiniTask
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: VincentDev.MiniTaskUITests
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: MiniTask
